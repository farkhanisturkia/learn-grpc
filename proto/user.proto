syntax = "proto3";

package pb;

import "job.proto";

option go_package = "user-service/pb";

message User {
  int64 id = 1;
  string name = 2;
  string email = 3;
  repeated Job jobs = 4;
}

message CreateUserRequest { string name = 1; string email = 2; }
message GetUserRequest { int64 id = 1; }
message UpdateUserRequest { int64 id = 1; string name = 2; string email = 3; }
message DeleteUserRequest { int64 id = 1; }
message EmptyUserResponse {}

service UserService {
  rpc CreateUser(CreateUserRequest) returns (User);
  rpc GetUser(GetUserRequest) returns (User);
  rpc UpdateUser(UpdateUserRequest) returns (User);
  rpc DeleteUser(DeleteUserRequest) returns (EmptyUserResponse);
}